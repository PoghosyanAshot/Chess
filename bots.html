<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Chess Bots</title>
        <link rel="stylesheet" href="styles/bots.css" />
    </head>

    <body>
        <header>
            <h1>Play With AI Opponents</h1>
            <p>Choose your rival and test your strategy ⚔️</p>
        </header>

        <main class="bot-grid">
            <div class="bot-card">
                <img src="images/bots/filip.png" alt="Filip" />
                <span class="name">Filip</span>
            </div>

            <div class="bot-card">
                <img src="images/bots/bill.png" alt="Bill" />
                <span class="name">Bill</span>
            </div>

            <div class="bot-card">
                <img src="images/bots/harry.png" alt="Harry" />
                <span class="name">Harry</span>
            </div>

            <div class="bot-card">
                <img src="images/bots/alice.png" alt="Alice" />
                <span class="name">Alice</span>
            </div>

            <div class="bot-card">
                <img src="images/bots/bob.png" alt="Bob" />
                <span class="name">Bob</span>
            </div>

            <div class="bot-card">
                <img src="images/bots/james.png" alt="James" />
                <span class="name">James</span>
            </div>

            <div class="bot-card">
                <img src="images/bots/lasker.png" alt="Lasker" />
                <span class="name">Lasker</span>
            </div>

            <div class="bot-card">
                <img src="images/bots/hikaru.png" alt="Hikaru" />
                <span class="name">Hikaru</span>
            </div>

            <div class="bot-card">
                <img src="images/bots/magnus.png" alt="Magnus" />
                <span class="name">Magnus</span>
            </div>
        </main>

        <footer>
            <p>♟️ Chess AI Arena — Train your mind, not your luck.</p>
        </footer>
    </body>
</html>
